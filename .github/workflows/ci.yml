name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# One run per branch. A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `tsc -b` is required: the root tsconfig.json has "files": [], so plain
      # `tsc --noEmit` would check zero files and pass unconditionally.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
