version: 2
updates:
  # Bumps the SHA-pinned actions (and their version comments) when new
  # releases ship — pinning without update automation goes stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
