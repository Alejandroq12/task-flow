version: 2
updates:
  # Bumps the SHA-pinned actions (and their version comments) when new
  # releases ship — pinning without update automation goes stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint supports typescript <6.1.0; unpin when it adds TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # graphql-request@7 peer-requires graphql '14 - 16'; unpin when widened.
      - dependency-name: graphql
        update-types: ['version-update:semver-major']
      # @types/node must match the Node major this project runs (24, see .nvmrc) —
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
